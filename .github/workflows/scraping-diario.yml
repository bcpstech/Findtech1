name: Scraping Diario FindTech.cl

workflow_dispatch:
    inputs:
      stores:
        type: choice
        options:
          - todas
          - n1g
          - alltec
          - cg
          - centrale
          - pcexpress

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    name: Scraping via Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-${{ hashFiles('package.json') }}
          restore-keys: node-

      - name: Instalar dependencias
        run: npm install

      - name: Inicializar DB
        run: node db/init.js
        env:
          DB_PATH: ./db/techcompara.db

      - name: Scrapear via Cloudflare Worker
        run: node scraper/stores/via-worker.js
        env:
          DB_PATH: ./db/techcompara.db
          NODE_ENV: production
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
          CF_SECRET_TOKEN: ${{ secrets.CF_SECRET_TOKEN }}

      - name: Exportar JSON
        run: node scripts/export-json.js
        env:
          DB_PATH: ./db/techcompara.db

      - name: Verificar productos
        run: |
          python3 -c "import json; data=json.load(open('docs/data/products.json')); print(f'{len(data)} productos exportados')"

      - name: Commit y Push
        run: |
          git config user.email "bot@github.com"
          git config user.name "github-actions[bot]"
          git add docs/data/
          git diff --staged --quiet || git commit -m "precios actualizados $(date '+%Y-%m-%d %H:%M') CLT"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
