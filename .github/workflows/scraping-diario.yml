name: Scraping FindTech.cl

on:
  workflow_dispatch:
    inputs:
      store:
        description: 'Tienda a scrapear'
        required: false
        default: 'todas'
        type: choice
        options:
          - todas
          - n1g
          - centralgamer
          - spdigital
          - trulustore
          - myshop

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      DB_PATH: ./db/techcompara.db
      CF_PROXY_URL: ${{ secrets.CF_PROXY_URL }}
      CF_PROXY_SECRET: ${{ secrets.CF_PROXY_SECRET }}
      R2_KEY_ID: ${{ secrets.R2_KEY_ID }}
      R2_SECRET: ${{ secrets.R2_SECRET }}
      R2_ENDPOINT: https://d51c60da1c778105ece9b7cfcc08451b.r2.cloudflarestorage.com
      R2_BUCKET: findtech-images
      R2_PUBLIC: https://images.findtech.cl

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Init database
        run: node db/init.js

      - name: Scrapear N1G
        if: ${{ github.event.inputs.store == 'todas' || github.event.inputs.store == 'n1g' }}
        run: node scraper/stores/n1g.js || echo "N1G fallo, continuando..."

      - name: Scrapear CentralGamer
        if: ${{ github.event.inputs.store == 'todas' || github.event.inputs.store == 'centralgamer' }}
        run: node scraper/stores/centralgamer.js || echo "CentralGamer fallo, continuando..."

      - name: Scrapear SP Digital
        if: ${{ github.event.inputs.store == 'todas' || github.event.inputs.store == 'spdigital' }}
        run: node scraper/stores/spdigital.js || echo "SP Digital fallo, continuando..."

      - name: Scrapear TruluStore
        if: ${{ github.event.inputs.store == 'todas' || github.event.inputs.store == 'trulustore' }}
        run: node scraper/stores/trulustore.js || echo "TruluStore fallo, continuando..."

      - name: Scrapear MyShop
        if: ${{ github.event.inputs.store == 'todas' || github.event.inputs.store == 'myshop' }}
        run: node scraper/stores/myshop.js || echo "MyShop fallo, continuando"

      - name: Debug stock en DB
        run: |
          node -e "
          const {getDb} = require('./db/database');
          const db = getDb();
          const rows = db.prepare('SELECT store_id, stock, COUNT(*) as cnt FROM prices GROUP BY store_id, stock ORDER BY store_id').all();
          console.table(rows);
          const cats = db.prepare('SELECT category_id, COUNT(*) as cnt FROM products GROUP BY category_id ORDER BY cnt DESC').all();
          console.log('Por categoría:');
          console.table(cats);
          "

      - name: Enriquecer specs
        run: node scripts/enrich-specs.js || echo "Enrich specs fallo, continuando..."

      - name: Exportar JSON
        run: node scripts/export-json.js

      - name: Commit y push datos
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git stash --include-untracked
          git pull --rebase origin main
          git stash pop || true
          git add docs/data/ db/techcompara.db
          git diff --staged --quiet || git commit -m "chore: actualizar datos $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
