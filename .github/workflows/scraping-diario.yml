name: Scraping FindTech.cl

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      store:
        description: 'Tienda a scrapear (dejar vacío para todas)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      DB_PATH: ./db/techcompara.db
      CF_PROXY_URL: ${{ secrets.CF_PROXY_URL }}
      CF_PROXY_SECRET: ${{ secrets.CF_PROXY_SECRET }}
      ICECAT_USER: BCPSTECH
      USE_ICECAT: 'false'
      R2_KEY_ID: ${{ secrets.R2_KEY_ID }}
      R2_SECRET: ${{ secrets.R2_SECRET }}
      R2_ENDPOINT: https://d51c60da1c778105ece9b7cfcc08451b.r2.cloudflarestorage.com
      R2_BUCKET: findtech-images
      R2_PUBLIC: https://images.findtech.cl

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Init database
        run: node db/init.js

      - name: Scrapear N1G
        if: ${{ github.event.inputs.store == '' || github.event.inputs.store == 'n1g' }}
        run: node scraper/stores/n1g.js || echo "N1G fallo, continuando..."

      - name: Scrapear Alltec
        if: ${{ github.event.inputs.store == '' || github.event.inputs.store == 'alltec' }}
        run: node scraper/stores/alltec.js || echo "Alltec fallo, continuando..."

      - name: Scrapear CentralGamer
        if: ${{ github.event.inputs.store == '' || github.event.inputs.store == 'centralgamer' }}
        run: node scraper/stores/centralgamer.js || echo "CentralGamer fallo, continuando..."

      - name: Scrapear Centrale
        if: ${{ github.event.inputs.store == '' || github.event.inputs.store == 'centrale' }}
        run: node scraper/stores/centrale.js || echo "Centrale fallo, continuando..."

      - name: Scrapear PC-Express
        if: ${{ github.event.inputs.store == '' || github.event.inputs.store == 'pcexpress' }}
        run: node scraper/stores/pcexpress.js || echo "PC-Express fallo, continuando..."

      - name: Debug stock en DB
        run: |
          node -e "
          const {getDb} = require('./db/database');
          const db = getDb();
          const rows = db.prepare('SELECT store_id, stock, COUNT(*) as cnt FROM prices GROUP BY store_id, stock ORDER BY store_id').all();
          console.table(rows);
          "
          
      - name: Exportar JSON
        run: node scripts/export-json.js

      - name: Commit y push datos
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/data/
          git diff --staged --quiet || git commit -m "chore: actualizar datos $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
