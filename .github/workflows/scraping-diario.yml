name: Scraping Diario FindTech.cl

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      stores:
        description: 'Tienda a scrapear'
        required: false
        default: 'todas'
        type: choice
        options:
          - todas
          - n1g
          - alltec
          - cg
          - centrale
          - pcexpress

permissions:
  contents: write

jobs:
  scrape:
    name: Scraping FindTech.cl
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-${{ hashFiles('package.json') }}
          restore-keys: node-

      - name: Instalar dependencias
        run: npm install

      - name: Inicializar DB
        run: |
          rm -f db/techcompara.db
          node db/init.js
        env:
          DB_PATH: ./db/techcompara.db
          
      - name: Scrapear N1G
        if: github.event.inputs.stores == 'todas' || github.event.inputs.stores == 'n1g' || github.event_name == 'schedule'
        run: node scraper/stores/n1g.js || echo "N1G fallo, continuando..."
        env:
          DB_PATH: ./db/techcompara.db
          NODE_ENV: production
          SCRAPE_TIMEOUT: '60000'

      - name: Scrapear Alltec
        if: github.event.inputs.stores == 'todas' || github.event.inputs.stores == 'alltec' || github.event_name == 'schedule'
        run: node scraper/stores/alltec.js || echo "Alltec fallo, continuando..."
        env:
          DB_PATH: ./db/techcompara.db
          NODE_ENV: production
          SCRAPE_TIMEOUT: '60000'

      - name: Scrapear CentralGamer
        if: github.event.inputs.stores == 'todas' || github.event.inputs.stores == 'cg' || github.event_name == 'schedule'
        run: node scraper/stores/centralgamer.js || echo "CentralGamer fallo, continuando..."
        env:
          DB_PATH: ./db/techcompara.db
          NODE_ENV: production
          SCRAPE_TIMEOUT: '60000'

      - name: Scrapear Centrale
        if: github.event.inputs.stores == 'todas' || github.event.inputs.stores == 'centrale' || github.event_name == 'schedule'
        run: node scraper/stores/centrale.js || echo "Centrale fallo, continuando..."
        env:
          DB_PATH: ./db/techcompara.db
          NODE_ENV: production
          SCRAPE_TIMEOUT: '60000'

      - name: Scrapear PC-Express
        if: github.event.inputs.stores == 'todas' || github.event.inputs.stores == 'pcexpress' || github.event_name == 'schedule'
        run: node scraper/stores/pcexpress.js || echo "PC-Express fallo, continuando..."
        env:
          DB_PATH: ./db/techcompara.db
          NODE_ENV: production
          SCRAPE_TIMEOUT: '60000'

      - name: Exportar JSON
        run: node scripts/export-json.js
        env:
          DB_PATH: ./db/techcompara.db

      - name: Verificar productos
        run: |
          python3 -c "
          import json
          data = json.load(open('docs/data/products.json'))
          print(f'{len(data)} productos exportados')
          if data:
            print(f'Ejemplo: {data[0][\"name\"]} - \${data[0].get(\"best_price\",0):,}')
          "

      - name: Commit y Push
        run: |
          git config user.email "bot@github.com"
          git config user.name "github-actions[bot]"
          git add docs/data/
          git diff --staged --quiet || git commit -m "precios actualizados $(date '+%Y-%m-%d %H:%M') CLT"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
